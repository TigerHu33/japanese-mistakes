services:
  db:
    image: postgres:16-alpine
    container_name: jp-mistakes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: jp_mistakes
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d jp_mistakes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: postgrest/postgrest:v12.2.0
    container_name: jp-mistakes-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://app:app_pass@db:5432/jp_mistakes
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: app
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  db_data:
